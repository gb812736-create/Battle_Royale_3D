<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101820">
<title>Battle Royale 3D BD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:system-ui,Arial;touch-action:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:5px;z-index:2;pointer-events:none}
.pill{background:#071019d9;border:1px solid #ffffff35;border-radius:12px;padding:7px 10px;font-size:12px;font-weight:800}
#mini{position:fixed;right:9px;top:54px;width:94px;height:94px;border:1px solid #ffffff70;border-radius:10px;background:#071019bb;z-index:2}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#071019bd;z-index:10;padding:18px}
.panel{width:min(440px,100%);background:linear-gradient(145deg,#18333c,#0b151d);border:1px solid #ffffff45;border-radius:20px;padding:22px;text-align:center;box-shadow:0 15px 55px #0009}
h1{margin:0 0 8px;color:#ffda45;font-size:27px}.desc{color:#d6e3e7;font-size:14px;line-height:1.5}
button{border:0;border-radius:13px;padding:12px 16px;font-size:15px;font-weight:900;background:#ffcf32;color:#17202a;touch-action:none;user-select:none}
#controls{position:fixed;bottom:15px;left:0;right:0;z-index:4;display:flex;align-items:end;justify-content:space-between;padding:0 13px;pointer-events:none}
#controls button{pointer-events:auto}
.pad{display:grid;grid-template-columns:43px 43px 43px;grid-template-rows:43px 43px 43px;gap:3px}
.ctrl{width:43px;height:43px;padding:0;border-radius:12px;color:white;background:#071019c7;border:1px solid #ffffff65;font-size:18px}.empty{visibility:hidden}
.right{display:flex;gap:8px;align-items:end}.fire{width:68px;height:68px;border-radius:50%;background:#f0443a;color:#fff;border:3px solid #ffffffaa;padding:0}.small{font-size:11px;padding:9px 10px;background:#071019d9;color:#fff;border:1px solid #ffffff65}
#hint{position:fixed;bottom:4px;left:50%;transform:translateX(-50%);font-size:10px;color:#ffffffc7;white-space:nowrap;z-index:3}
@media(min-width:760px){#controls{max-width:900px;left:50%;transform:translateX(-50%)}}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"><div class="pill">❤️ <span id="hp">100</span>　👾 বাকি <span id="alive">9</span></div><div class="pill">🔫 <span id="ammo">30</span>　🏆 <span id="score">0</span></div></div>
<canvas id="mini" width="94" height="94"></canvas>
<div id="controls">
<div class="pad"><button class="ctrl empty"></button><button class="ctrl" data-key="up">▲</button><button class="ctrl empty"></button><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="down">▼</button><button class="ctrl" data-key="right">▶</button><button class="ctrl empty"></button><button class="ctrl empty"></button><button class="ctrl empty"></button></div>
<div class="right"><button id="reload" class="small">RELOAD</button><button id="fire" class="fire">FIRE</button></div>
</div><div id="hint">তীর/WASD: চলাফেরা • FIRE: গুলি • RELOAD: অ্যামো • হলুদ জোনে থাকো</div>
<div id="overlay"><div class="panel"><h1 id="title">BATTLE ROYALE 3D BD</h1><p id="desc" class="desc">নিজস্ব 3D Battle Royale প্রোটোটাইপ<br>তৃতীয়-ব্যক্তি ক্যামেরা, বট শত্রু, গুলি, অ্যামো, লুট ও ছোট হওয়া নিরাপদ জোন।<br><br>এটি অফলাইন single-player demo; অনলাইন multiplayer নয়।</p><button id="start">ম্যাচ শুরু</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

const canvas=document.querySelector('#view');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true, powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ec7df);scene.fog=new THREE.Fog(0x8ec7df,42,115);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);
scene.add(new THREE.HemisphereLight(0xdff4ff,0x48603b,2.0));
const sun=new THREE.DirectionalLight(0xfff0d2,2.2);sun.position.set(-25,40,15);scene.add(sun);
const mat=(color,roughness=.9)=>new THREE.MeshStandardMaterial({color,roughness});
const groundMat=mat(0x477d48),treeMat=mat(0x23633a),treeLight=mat(0x348b4b),trunkMat=mat(0x765137),rockMat=mat(0x777f7b),blueMat=mat(0x159be8),darkMat=mat(0x1d2a3c),skinMat=mat(0xffc58b),redMat=mat(0xd63e3e),goldMat=mat(0xffd44c),whiteMat=mat(0xf3f4e9),medMat=mat(0x4ce18a);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(180,180),groundMat);floor.rotation.x=-Math.PI/2;floor.position.y=-.08;scene.add(floor);
const grid=new THREE.GridHelper(180,45,0x6e9d68,0x6e9d6840);grid.position.y=-.04;scene.add(grid);
const world={size:84};let player,bots=[],bullets=[],loot=[],obstacles=[],zone,ring,score=0,ammo=30,reloadT=0,shotT=0,elapsed=0,running=false,keys={},last=0,aimAngle=0;
const mini=document.querySelector('#mini'),mx=mini.getContext('2d');
function makeChar(color,isPlayer=false){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.62,4,8),mat(color));body.position.y=1.08;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),skinMat);head.position.y=1.77;g.add(head);
 const pack=new THREE.Mesh(new THREE.BoxGeometry(.48,.48,.22),darkMat);pack.position.set(0,1.15,-.35);g.add(pack);
 const gun=new THREE.Mesh(new THREE.BoxGeometry(.16,.15,.92),darkMat);gun.position.set(.28,1.28,.48);g.add(gun);
 const legs=new THREE.Mesh(new THREE.BoxGeometry(.55,.45,.38),mat(isPlayer?0x263c59:0x542e2e));legs.position.y=.42;g.add(legs);
 g.userData={gun};return g;
}
function addTree(x,z,r=1){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.15*r,.22*r,1.5*r,7),trunkMat);trunk.position.y=.75*r;g.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(.95*r,2.2*r,8),treeMat);crown.position.y=2.25*r;g.add(crown);const crown2=new THREE.Mesh(new THREE.ConeGeometry(.68*r,1.7*r,8),treeLight);crown2.position.y=2.8*r;g.add(crown2);g.position.set(x,0,z);scene.add(g);obstacles.push({x,z,r:1.0*r,type:'tree'});}
function addRock(x,z,r){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(r,0),rockMat);m.position.set(x,r*.6,z);m.scale.y=.7;scene.add(m);obstacles.push({x,z,r,type:'rock'});}
function clearObjects(){for(const o of [...obstacles.map(x=>x.mesh).filter(Boolean),...scene.children.filter(o=>o.userData.generated)])scene.remove(o);scene.clear();scene.background=new THREE.Color(0x8ec7df);scene.fog=new THREE.Fog(0x8ec7df,42,115);scene.add(new THREE.HemisphereLight(0xdff4ff,0x48603b,2));const s=new THREE.DirectionalLight(0xfff0d2,2.2);s.position.set(-25,40,15);scene.add(s);scene.add(floor);scene.add(grid);obstacles=[];bots=[];bullets=[];loot=[];}
function rand(a,b){return a+Math.random()*(b-a)}
function makeLoot(x,z,type){const group=new THREE.Group();const box=new THREE.Mesh(new THREE.BoxGeometry(.55,.35,.55),type==='med'?medMat:goldMat);box.position.y=.3;group.add(box);if(type==='med'){const a=new THREE.Mesh(new THREE.BoxGeometry(.12,.38,.1),whiteMat);const b=new THREE.Mesh(new THREE.BoxGeometry(.38,.12,.1),whiteMat);a.position.y=.3;b.position.y=.3;group.add(a,b)}group.position.set(x,0,z);scene.add(group);loot.push({mesh:group,x,z,type,taken:false});}
function makeBot(){let a=rand(0,Math.PI*2),r=rand(15,37),x=Math.cos(a)*r,z=Math.sin(a)*r;const mesh=makeChar(0xd84642);mesh.position.set(x,0,z);scene.add(mesh);bots.push({mesh,x,z,hp:100,speed:rand(2,3),fire:rand(1,2),alive:true});}
function start(){
 clearObjects();score=0;ammo=30;reloadT=0;shotT=0;elapsed=0;keys={};
 player={mesh:makeChar(0x159be8,true),x:0,z:0,hp:100,speed:8,angle:0};scene.add(player.mesh);
 for(let i=0;i<38;i++){let x=rand(-75,75),z=rand(-75,75);if(Math.hypot(x,z)<10)continue;if(Math.random()<.7)addTree(x,z,rand(.65,1.3));else addRock(x,z,rand(.4,.9));}
 for(let i=0;i<8;i++)makeBot();
 for(let i=0;i<22;i++)makeLoot(rand(-70,70),rand(-70,70),Math.random()<.65?'ammo':'med');
 zone={x:0,z:0,r:75};const geo=new THREE.RingGeometry(74.5,75,100);ring=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xffdf46,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.05;scene.add(ring);
 running=true;document.querySelector('#overlay').style.display='none';last=performance.now();requestAnimationFrame(loop);
}
function end(title,desc){running=false;document.querySelector('#title').textContent=title;document.querySelector('#desc').innerHTML=desc;document.querySelector('#start').textContent='আবার খেলো';document.querySelector('#overlay').style.display='flex';}
document.querySelector('#start').onclick=start;
function nearestBot(){let t=null,dmin=1e9;for(const b of bots){if(!b.alive)continue;const d=Math.hypot(b.x-player.x,b.z-player.z);if(d<dmin){dmin=d;t=b}}return t}
function shoot(){if(!running||shotT>0||reloadT>0)return;if(ammo<=0){reload();return;}const b=nearestBot();if(!b)return;const dx=b.x-player.x,dz=b.z-player.z,dist=Math.hypot(dx,dz);player.angle=Math.atan2(dx,dz);player.mesh.rotation.y=player.angle;const mesh=new THREE.Mesh(new THREE.SphereGeometry(.12,8,6),goldMat);mesh.position.set(player.x,1.25,player.z);scene.add(mesh);bullets.push({mesh,target:b,life:.45,owner:'p',damage:38,dx:dx/(dist||1),dz:dz/(dist||1)});ammo--;shotT=.22;}
function reload(){if(ammo<30&&reloadT<=0)reloadT=1.25;}
document.querySelector('#fire').addEventListener('pointerdown',e=>{e.preventDefault();keys.fire=true;shoot()});['pointerup','pointercancel','pointerleave'].forEach(ev=>document.querySelector('#fire').addEventListener(ev,()=>keys.fire=false));
document.querySelector('#reload').onclick=reload;
document.querySelectorAll('[data-key]').forEach(btn=>{let k=btn.dataset.key;btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,()=>keys[k]=false));});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','arrowup'].includes(k))keys.up=true;if(['s','arrowdown'].includes(k))keys.down=true;if(['a','arrowleft'].includes(k))keys.left=true;if(['d','arrowright'].includes(k))keys.right=true;if(k===' '){keys.fire=true;shoot()}if(k==='r')reload();});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(['w','arrowup'].includes(k))keys.up=false;if(['s','arrowdown'].includes(k))keys.down=false;if(['a','arrowleft'].includes(k))keys.left=false;if(['d','arrowright'].includes(k))keys.right=false;if(k===' ')keys.fire=false;});
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.04);last=now;update(dt);render();if(running)requestAnimationFrame(loop);}
function update(dt){elapsed+=dt;shotT=Math.max(0,shotT-dt);if(reloadT>0){reloadT-=dt;if(reloadT<=0)ammo=30;}
 let dx=(keys.right?1:0)-(keys.left?1:0),dz=(keys.down?1:0)-(keys.up?1:0),l=Math.hypot(dx,dz)||1;player.x+=dx/l*player.speed*dt;player.z+=dz/l*player.speed*dt;player.x=THREE.MathUtils.clamp(player.x,-83,83);player.z=THREE.MathUtils.clamp(player.z,-83,83);player.mesh.position.set(player.x,0,player.z);
 if(dx||dz){player.angle=Math.atan2(dx,dz);player.mesh.rotation.y=player.angle;}if(keys.fire&&shotT<=0)shoot();
 zone.r=Math.max(13,75-Math.max(0,elapsed-9)*.28);ring.scale.set(zone.r/75,zone.r/75,zone.r/75);if(Math.hypot(player.x-zone.x,player.z-zone.z)>zone.r)player.hp-=8*dt;
 for(const b of bots){if(!b.alive)continue;const dx=player.x-b.x,dz=player.z-b.z,d=Math.hypot(dx,dz),a=Math.atan2(dx,dz);if(d>5){b.x+=Math.sin(a)*b.speed*dt;b.z+=Math.cos(a)*b.speed*dt;}b.mesh.position.set(b.x,0,b.z);b.mesh.rotation.y=a;b.fire-=dt;if(d<22&&b.fire<=0){b.fire=rand(1.1,2);player.hp-=rand(4,8);}}
 for(const bu of bullets){bu.life-=dt;if(bu.owner==='p'){bu.mesh.position.x+=bu.dx*24*dt;bu.mesh.position.z+=bu.dz*24*dt;if(bu.target.alive&&Math.hypot(bu.mesh.position.x-bu.target.x,bu.mesh.position.z-bu.target.z)<1.4){bu.target.hp-=bu.damage;bu.life=0;if(bu.target.hp<=0){bu.target.alive=false;scene.remove(bu.target.mesh);score+=100;makeLoot(bu.target.x,bu.target.z,'ammo');}}}}
 bullets=bullets.filter(b=>{if(b.life<=0){scene.remove(b.mesh);return false;}return true;});
 for(const it of loot){if(it.taken)continue;if(Math.hypot(player.x-it.x,player.z-it.z)<1.5){it.taken=true;scene.remove(it.mesh);if(it.type==='med')player.hp=Math.min(100,player.hp+25);else ammo=Math.min(30,ammo+10);score+=15;}}
 const alive=bots.filter(b=>b.alive).length+1;document.querySelector('#hp').textContent=Math.max(0,Math.ceil(player.hp));document.querySelector('#alive').textContent=alive;document.querySelector('#ammo').textContent=reloadT>0?'…':ammo;document.querySelector('#score').textContent=score;
 if(player.hp<=0){end('তুমি বাদ পড়েছ!',`তোমার স্কোর: <b>${score}</b><br>আবার চেষ্টা করো।`);return;}if(alive===1){end('BOOYAH! তুমি জিতেছ!',`জিতে গেছ! স্কোর: <b>${score}</b>`);return;}}
function render(){const target=new THREE.Vector3(player.x,1,player.z);const back=new THREE.Vector3(Math.sin(player.angle)*8,5.3,Math.cos(player.angle)*8);camera.position.set(player.x-back.x,player.mesh.position.y+back.y,player.z-back.z);camera.lookAt(target);renderer.render(scene,camera);
 mx.clearRect(0,0,94,94);mx.fillStyle='#23492d';mx.fillRect(0,0,94,94);mx.strokeStyle='#ffdf46';mx.lineWidth=1.5;mx.beginPath();mx.arc(47,47,zone.r/84*47,0,Math.PI*2);mx.stroke();for(const b of bots){if(b.alive){mx.fillStyle='#ff6258';mx.fillRect(47+b.x/84*47-1,47+b.z/84*47-1,3,3)}}mx.fillStyle='#35b8ff';mx.beginPath();mx.arc(47+player.x/84*47,47+player.z/84*47,3,0,7);mx.fill();}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);
</script></body></html>
